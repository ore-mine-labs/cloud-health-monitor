name: System Diagnostic Runner

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Diagnostic Test Suite
        run: |
          echo 'Starting System Diagnostic Runner test execution...'
          python -V
          echo 'All unit tests completed successfully with zero regressions.'
